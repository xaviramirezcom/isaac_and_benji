<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Animal sound audition</title>
<style>
 body{font:16px system-ui;margin:0;padding:20px;background:#f4f7fb;color:#13294b}
 h1{margin:0 0 6px} p{margin:0 0 20px;opacity:.7}
 .a{display:flex;gap:16px;align-items:center;background:#fff;border-radius:16px;padding:12px 16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
 .a img{width:72px;height:72px}.a h2{margin:0;width:90px;text-transform:capitalize}
 .opts{display:flex;flex-wrap:wrap;gap:10px}
 button{border:0;border-radius:12px;padding:10px 14px;background:#e6efff;font:inherit;font-weight:700;cursor:pointer;min-width:120px;text-align:left}
 button small{display:block;font-weight:400;opacity:.65;font-size:12px}
 button.playing{background:#ffd94d}
</style></head><body>
<h1>Animal sound audition</h1>
<p>Tap to listen. Tell me which number sounds best for each animal (or "none").</p>
<div id="list"></div>
<script>
let current=null;
fetch('manifest.json',{cache:'no-store'}).then(r=>r.json()).then(m=>{
  const list=document.getElementById('list');
  for(const [animal,opts] of Object.entries(m)){
    const row=document.createElement('div');row.className='a';
    row.innerHTML=`<img src="../../images/animals/${animal}.svg" alt=""><h2>${animal}</h2><div class="opts"></div>`;
    opts.forEach((o,i)=>{
      const b=document.createElement('button');
      b.innerHTML=`▶ ${i+1}<small>${o.title.slice(0,26)}</small><small>${o.license} · ${o.secs}s</small>`;
      b.onclick=()=>{ if(current){current.audio.pause();current.btn.classList.remove('playing')}
        const audio=new Audio(o.file);audio.play();b.classList.add('playing');audio.onended=()=>b.classList.remove('playing');current={audio,btn:b}};
      row.querySelector('.opts').appendChild(b);
    });
    list.appendChild(row);
  }
});
</script></body></html>
