<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Isaac &amp; Benji</title>
  <meta name="theme-color" content="#7fd1ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Isaac & Benji">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script src="vendor/topojson-client.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="app">

    <!-- Who is playing? -->
    <section id="view-home" class="view home" aria-label="Who is playing?">
      <div class="picker">
        <a class="kid-card isaac" href="#/isaac"><span class="avatar" aria-hidden="true">🌍</span><span class="kid-name">Isaac</span></a>
        <a class="kid-card benji" href="#/benji"><span class="avatar" aria-hidden="true">🧸</span><span class="kid-name">Benji</span></a>
      </div>
    </section>

    <!-- Isaac's games -->
    <section id="view-isaac" class="view menu isaac-bg" hidden aria-label="Isaac's games">
      <a class="round-btn back" href="#/" aria-label="Back">←</a>
      <div class="tiles">
        <a class="game-tile" href="#/isaac/map"><span class="emoji" aria-hidden="true">🗺️</span><span>World Map</span></a>
      </div>
    </section>

    <!-- Benji's games -->
    <section id="view-benji" class="view menu benji-bg" hidden aria-label="Benji's games">
      <a class="round-btn back" href="#/" aria-label="Back">←</a>
      <div class="tiles">
        <a class="game-tile animals-tile" href="#/benji/animals"><span class="emoji" aria-hidden="true">🐶</span><span>Animals</span></a>
      </div>
    </section>

    <!-- Animals game -->
    <section id="view-animals" class="view animals" hidden aria-label="Animals">
      <a class="round-btn back" href="#/benji" aria-label="Back">←</a>
      <div class="animals-top">
        <div class="lang" role="group" aria-label="Language">
          <button type="button" data-lang="en" class="on">EN</button>
          <button type="button" data-lang="es">ES</button>
        </div>
        <button class="round-btn small" id="btn-credits" type="button" aria-label="Credits">ⓘ</button>
      </div>

      <div class="stage">
        <button class="animal-pic" id="animal-pic" type="button" aria-label="Play the sound"><img id="animal-img" alt=""></button>
        <h2 class="animal-name" id="animal-name"></h2>
      </div>

      <div class="actions">
        <div class="action"><button class="big-btn name" id="btn-name" type="button" aria-label="Say the name"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 5h18a4 4 0 0 1 4 4v11a4 4 0 0 1-4 4H16l-7 5v-5H7a4 4 0 0 1-4-4V9a4 4 0 0 1 4-4z" fill="currentColor"/><circle cx="10.5" cy="14.5" r="2" fill="#2b59d9"/><circle cx="16" cy="14.5" r="2" fill="#2b59d9"/><circle cx="21.5" cy="14.5" r="2" fill="#2b59d9"/></svg></button><span id="lbl-name">Name</span></div>
        <div class="action"><button class="big-btn sound" id="btn-sound" type="button" aria-label="Play the sound"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 12h5.5L16 5.5v21L8.5 20H3z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M21 11.5a6.5 6.5 0 0 1 0 9M25 7.5a12 12 0 0 1 0 17" stroke="currentColor" stroke-width="2.8" fill="none" stroke-linecap="round"/></svg></button><span id="lbl-sound">Sound</span></div>
        <div class="action"><button class="big-btn next" id="btn-next" type="button" aria-label="Next animal"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 16h19M16.5 7.5 25 16l-8.5 8.5" stroke="currentColor" stroke-width="4.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span id="lbl-next">Next</span></div>
      </div>

      <div class="credits" id="credits" hidden>
        <div class="credits-card">
          <button class="panel-close" id="credits-close" type="button" aria-label="Close">✕</button>
          <h3>Credits</h3>
          <p>Pictures: Noto Emoji by Google (Apache 2.0).</p>
          <ul id="credits-list"></ul>
        </div>
      </div>

      <div class="loading done" id="animals-loading"></div>
    </section>

    <!-- World map game -->
    <section id="view-map" class="view map" hidden aria-label="World map">
      <canvas id="globe" aria-label="Globe of the world"></canvas>

      <a class="round-btn back" href="#/isaac" aria-label="Back">←</a>
      <button class="round-btn dice" id="btn-random" type="button" aria-label="Random country">🎲</button>
      <div class="zoom">
        <button class="round-btn" id="btn-zoom-in" type="button" aria-label="Zoom in">＋</button>
        <button class="round-btn" id="btn-zoom-out" type="button" aria-label="Zoom out">－</button>
      </div>

      <aside class="panel" id="panel" aria-live="polite" aria-hidden="true">
        <div class="lang" role="group" aria-label="Language">
          <button type="button" data-lang="en" class="on">EN</button>
          <button type="button" data-lang="es">ES</button>
        </div>
        <button class="panel-close" id="panel-close" type="button" aria-label="Close">✕</button>
        <img class="panel-flag" id="panel-flag" alt="">
        <div class="panel-info">
          <h2 class="panel-name" id="panel-name"></h2>
          <div class="panel-cap">
            <span class="cap-icon" aria-hidden="true">🏛️</span>
            <div><small id="panel-cap-label">Capital</small><strong id="panel-cap"></strong></div>
          </div>
        </div>
        <button class="speak round-btn" id="btn-speak" type="button" aria-label="Say it out loud">🔊</button>
      </aside>

      <div class="loading" id="loading">
        <div class="spinner" aria-hidden="true">🌍</div>
        <div class="bar"><i id="loading-bar"></i></div>
        <p id="loading-text">Loading the world…</p>
      </div>
    </section>

  </main>
</body>
</html>
